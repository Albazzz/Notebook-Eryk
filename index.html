<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mẫu lật flashcard · Note Eryk</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #eef2f8;
        color: #18243a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main { width: min(100%, 680px); }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 650;
      }

      .card-scene { perspective: 1200px; }

      .flip-card {
        display: block;
        width: 100%;
        height: clamp(330px, 50vw, 410px);
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        text-align: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .flip-card:focus-visible {
        outline: 3px solid #4056b6;
        outline-offset: 6px;
      }

      .card-inner {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 560ms cubic-bezier(.2, .7, .2, 1);
      }

      .flip-card.is-flipped .card-inner { transform: rotateY(180deg); }

      .card-face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px;
        border: 1px solid #d8e0ee;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 36px rgba(34, 50, 83, .08);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .card-back { transform: rotateY(180deg); }

      .face-name {
        position: absolute;
        top: 24px;
        left: 28px;
        color: #586881;
        font-size: 14px;
        font-weight: 600;
      }

      .word {
        margin: 0;
        font-size: clamp(54px, 10vw, 84px);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: .02em;
      }

      .reading {
        margin-top: 14px;
        color: #56657e;
        font-size: 20px;
      }

      .meaning {
        margin: 0;
        font-size: clamp(32px, 6vw, 48px);
        font-weight: 650;
        text-align: center;
      }

      .han-viet {
        margin-top: 16px;
        color: #4257ad;
        font-size: 17px;
        font-weight: 600;
        text-align: center;
      }

      .face-hint {
        position: absolute;
        bottom: 23px;
        margin: 0;
        color: #65738b;
        font-size: 14px;
        text-align: center;
      }

      .instruction {
        margin: 18px 0 0;
        color: #4f5f78;
        text-align: center;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        .card-inner { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mẫu lật flashcard</h1>
      <div class="card-scene">
        <button class="flip-card" id="flashcard" type="button" aria-label="Mặt trước: 認識. Chạm để xem nghĩa" aria-pressed="false">
          <span class="card-inner">
            <span class="card-face card-front" id="front">
              <span class="face-name">Mặt trước</span>
              <span class="word" lang="ja">認識</span>
              <span class="face-hint">Chạm để xem nghĩa</span>
            </span>
            <span class="card-face card-back" id="back" aria-hidden="true">
              <span class="face-name">Mặt sau</span>
              <span class="meaning">Nhận thức, nhận biết</span>
              <span class="reading" lang="ja">にんしき</span>
              <span class="han-viet">Hán Việt: NHẬN THỨC</span>
              <span class="face-hint">Chạm để xem lại từ</span>
            </span>
          </span>
        </button>
      </div>
      <p class="instruction">Chạm vào thẻ hoặc nhấn Enter / Space để lật qua lại.</p>
    </main>
    <script>
      const card = document.querySelector('#flashcard');
      const front = document.querySelector('#front');
      const back = document.querySelector('#back');

      card.addEventListener('click', () => {
        const flipped = card.classList.toggle('is-flipped');
        card.setAttribute('aria-pressed', String(flipped));
        card.setAttribute('aria-label', flipped
          ? 'Mặt sau: Nhận thức, nhận biết. Chạm để xem lại từ'
          : 'Mặt trước: 認識. Chạm để xem nghĩa');
        front.setAttribute('aria-hidden', String(flipped));
        back.setAttribute('aria-hidden', String(!flipped));
      });
    </script>
  </body>
</html>
